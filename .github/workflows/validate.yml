name: Validate OmniHub Portal

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "crm-module.js"
      - "order.html"
      - "order-v21.js"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "crm-module.js"
      - "order.html"
      - "order-v21.js"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate management portal
        run: node tests/validate.mjs
      - name: Syntax-check customer ordering client
        run: node --check order-v21.js
      - name: Verify ordering page loads the completed client
        run: grep -Fq '<script src="order-v21.js"></script>' order.html
