name: Validate OmniHub Portal

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "crm-module.js"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "crm-module.js"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node tests/validate.mjs
