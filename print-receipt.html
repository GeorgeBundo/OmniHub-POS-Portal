<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniHub Receipt Printer</title>
<style id="paperStyle">@page{size:A5 portrait;margin:8mm}</style>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#eef0f3}
body{margin:0;padding:22px}
.receipt{width:100%;max-width:148mm;min-height:190mm;margin:0 auto;background:#fff;padding:10mm;box-shadow:0 10px 35px rgba(0,0,0,.14)}
.brand{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #e52421;padding-bottom:12px}
.logo{display:none;max-width:45mm;max-height:25mm;object-fit:contain}
h1{margin:0;color:#e52421;font-size:22px}.title{text-align:right;font-size:18px;font-weight:800}
.contact,.muted{font-size:11px;color:#555;line-height:1.45}.header{text-align:center;font-weight:700;margin:10px 0}
.meta{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;margin:16px 0;font-size:12px}
.meta strong{text-transform:uppercase;font-size:10px;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
th,td{padding:7px;border:1px solid #bbb;text-align:left;vertical-align:top}th{background:#f1f1f1}
.number{text-align:right;white-space:nowrap}.total{font-size:18px;font-weight:800;text-align:right;margin:14px 0}
.extra{white-space:pre-wrap;font-size:11px;line-height:1.5;margin-top:14px}
.thanks{text-align:center;font-weight:700;margin-top:26px}.footer{text-align:center;color:#666;font-size:10px;margin-top:8px}
.controls{max-width:148mm;margin:0 auto 12px;display:flex;justify-content:center;gap:8px}
button{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:#111;color:#fff}button:first-child{background:#e52421}
.waiting{text-align:center;padding:60px 20px;color:#555}
body.thermal{padding:0;background:#fff}.thermal .receipt{width:100%;min-height:0;padding:2mm;box-shadow:none}.thermal .brand{display:block;text-align:center}.thermal h1,.thermal .title{text-align:center;font-size:15px}.thermal .logo{margin:0 auto 5px;max-width:80%;max-height:22mm}.thermal .meta{grid-template-columns:1fr;gap:2px;margin:8px 0}.thermal .meta strong{margin-top:4px}.thermal table{font-size:9px;margin:8px 0}.thermal th,.thermal td{padding:3px}.thermal .total{font-size:13px}.thermal .extra{font-size:9px;margin-top:8px}.thermal .thanks{margin-top:12px}.thermal .contact{font-size:9px}
@media print{body{background:#fff;padding:0}.receipt{max-width:none;min-height:0;box-shadow:none}.controls{display:none}.waiting{display:none}}
</style>
</head>
<body>
<div class="controls"><button id="printAgain" type="button">Choose printer</button><button id="closeWindow" type="button">Close</button></div>
<main id="receipt" class="receipt" hidden>
  <div id="header" class="header" hidden></div>
  <div class="brand"><div><img id="logo" class="logo" alt="OmniHub Solutions logo"><h1 id="business"></h1><div id="contact" class="contact"></div></div><div id="title" class="title"></div></div>
  <div class="meta"><strong>Receipt number</strong><span id="receiptNumber"></span><strong>Date</strong><span id="date"></span><strong>Till</strong><span id="till"></span><strong>Cashier</strong><span id="cashier"></span><strong id="customerLabel" hidden>Customer</strong><span id="customerName" style="overflow-wrap:anywhere;min-width:0" hidden></span><strong>Payment</strong><span id="payment"></span></div>
  <table><thead><tr><th>Description</th><th class="number">Qty</th><th class="number">Unit price</th><th class="number">Amount</th></tr></thead><tbody><tr><td id="description"></td><td id="quantity" class="number"></td><td id="unitPrice" class="number"></td><td id="amount" class="number"></td></tr></tbody></table>
  <div id="total" class="total"></div>
  <div id="information" class="extra" hidden></div>
  <section id="termsSection" hidden><strong>Terms &amp; Conditions</strong><div id="terms" class="extra"></div></section>
  <div id="thanks" class="thanks"></div><div id="footer" class="footer"></div>
</main>
<div id="waiting" class="waiting">Waiting for the sale to be recorded securely…</div>
<script>
'use strict';
const token=decodeURIComponent(location.hash.slice(1));
const origin=location.origin;
const byId=id=>document.getElementById(id);
const setText=(id,value)=>{byId(id).textContent=value==null?'':String(value)};
function applyOptional(id,value){const element=byId(id);element.textContent=value||'';element.hidden=!value}
function configurePaper(paper){
  const rules={A4:'@page{size:A4 portrait;margin:10mm}',A5:'@page{size:A5 portrait;margin:8mm}',thermal80:'@page{size:80mm 220mm;margin:3mm}',thermal58:'@page{size:58mm 220mm;margin:2mm}'};
  byId('paperStyle').textContent=rules[paper]||rules.A5;
  const thermal=paper==='thermal80'||paper==='thermal58';
  document.body.classList.toggle('thermal',thermal);
  if(thermal)byId('receipt').style.width=paper==='thermal58'?'58mm':'80mm';
}
function render(payload){
  configurePaper(payload.paper);
  setText('business',payload.business);
  setText('title',payload.title);
  setText('contact',[payload.address,payload.phones].filter(Boolean).join('\n'));
  setText('receiptNumber',payload.receiptNumber);
  setText('date',payload.date);
  setText('till',payload.till);
  setText('cashier',payload.cashier);
  applyOptional('customerName',payload.customerName);
  byId('customerLabel').hidden=!payload.customerName;
  setText('payment',payload.payment+(payload.reference?' · '+payload.reference:''));
  setText('description',payload.description);
  setText('quantity',Number(payload.quantity||0).toFixed(3).replace(/\.?0+$/,''));
  setText('unitPrice',payload.currency+' '+Number(payload.unitPrice||0).toFixed(2));
  setText('amount',payload.currency+' '+Number(payload.total||0).toFixed(2));
  setText('total','TOTAL: '+payload.currency+' '+Number(payload.total||0).toFixed(2));
  setText('thanks',payload.thanks);
  setText('footer',payload.footer);
  applyOptional('header',payload.header);
  applyOptional('information',payload.information);
  applyOptional('terms',payload.terms);
  byId('termsSection').hidden=!payload.terms;
  const logo=byId('logo');
  if(typeof payload.logo==='string'&&payload.logo.startsWith('data:image/png;base64,')){logo.src=payload.logo;logo.style.display='block'}
  byId('waiting').hidden=true;
  byId('receipt').hidden=false;
  document.title='OmniHub Receipt '+payload.receiptNumber;
  setTimeout(()=>{window.focus();window.print()},250);
}
window.addEventListener('message',event=>{
  if(event.origin!==origin||event.source!==window.opener||event.data?.type!=='omnihub-print-payload'||event.data.token!==token)return;
  render(event.data.payload||{});
},{once:true});
byId('printAgain').onclick=()=>window.print();
byId('closeWindow').onclick=()=>window.close();
if(window.opener)window.opener.postMessage({type:'omnihub-print-ready',token},origin);
else setText('waiting','This printer window is no longer connected to the sale. Close it and try again.');
</script>
</body>
</html>
